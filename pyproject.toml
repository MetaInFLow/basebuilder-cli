[project]
name = "basebuilder-cli"
dynamic = ["version"]
description = "BaseBuilder product CLI for registered users."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
basebuilder = "basebuilder_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "basebuilder_cli.__version__"}

[tool.setuptools.package-data]
basebuilder_cli = [
    "resources/basebuilder-cli/SKILL.md",
    "resources/basebuilder-cli/scripts/check_version.py",
]
