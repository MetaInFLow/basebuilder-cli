[project]
name = "basebuilder-cli"
version = "0.1.0"
description = "BaseBuilder product CLI for registered users."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
basebuilder = "basebuilder_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
basebuilder_cli = ["resources/basebuilder-cli/SKILL.md"]
